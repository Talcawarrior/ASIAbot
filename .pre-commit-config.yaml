repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
        exclude: '\.(md|json|yaml|yml|toml|ini|cfg|txt|ts|tsx|js|css|html|bat|ps1)$'
      - id: ruff-format
        exclude: '\.(md|json|yaml|yml|toml|ini|cfg|txt|ts|tsx|js|css|html|bat|ps1)$'

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--config-file=mypy.ini, --exclude=scripts/]
        exclude: ^scripts/
        additional_dependencies: [types-requests, types-python-dateutil, sqlalchemy2-stubs]
